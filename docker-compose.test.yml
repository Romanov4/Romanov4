# Локальный FreeLLMAPI для интеграционных тестов.
# Запуск: ENCRYPTION_KEY=$(openssl rand -hex 32) docker compose -f docker-compose.test.yml up -d
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?задайте ENCRYPTION_KEY}
      PORT: "3001"
    volumes:
      - freellmapi-test-data:/app/server/data

volumes:
  freellmapi-test-data:
